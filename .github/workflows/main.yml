name: Windows - LiteManager

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Required Folders & Shortcuts (Error Fix)
        run: |
          # Epic Games shortcut banao
          $WshShell = New-Object -ComObject WScript.Shell
          $Shortcut = $WshShell.CreateShortcut("C:\Users\Public\Desktop\Epic Games Launcher.lnk")
          $Shortcut.TargetPath = "C:\Windows\System32\cmd.exe"
          $Shortcut.Save()

          # LiteManager folder banao (agar nahi hai toh)
          if (!(Test-Path "C:\Program Files\LiteManager")) {
            New-Item -ItemType Directory -Path "C:\Program Files\LiteManager" -Force
          }

          # Desktop path check karo
          if (!(Test-Path "C:\Users\Public\Desktop")) {
            New-Item -ItemType Directory -Path "C:\Users\Public\Desktop" -Force
          }

          Write-Host "Folders aur shortcuts ban gaye!"

      - name: Downloading & Installing Essentials
        continue-on-error: true
        run: |
          Invoke-WebRequest -Uri "https://gitlab.com/chamod12/lm_win-10_github_rdp/-/raw/main/Downloads.bat" -OutFile "Downloads.bat"
          cmd /c Downloads.bat

      - name: Create show.bat File
        run: |
          @'
          @echo off
          echo Connecting to LiteManager...
          if exist "C:\Program Files\LiteManager\LiteManager.exe" (
            start "" "C:\Program Files\LiteManager\LiteManager.exe"
            echo Connected!
          ) else (
            echo LiteManager not found, skipping...
          )
          '@ | Out-File -FilePath "show.bat" -Encoding ascii

      - name: Create loop.bat File
        run: |
          @'
          @echo off
          :loop
          echo Time Counter Running...
          timeout /t 60 /nobreak >nul
          goto loop
          '@ | Out-File -FilePath "loop.bat" -Encoding ascii

      - name: Connect to LiteManager
        continue-on-error: true
        run: cmd /c show.bat

      - name: Time Counter
        continue-on-error: true
        run: cmd /c loop.bat
